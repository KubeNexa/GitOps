apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    tier: frontend
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: frontend
    spec:
      # 101/101 is nginx-unprivileged's real built-in "nginx" user -
      # verified by building the image and running `id` inside it, same
      # as every other service, not assumed.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101

      terminationGracePeriodSeconds: 15

      containers:
        - name: frontend
          image: manoj_s/frontend:REPLACE_WITH_IMAGE_TAG
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # 8080, not 80: nginx-unprivileged (the base image frontend's
          # Dockerfile actually uses) can't bind to 80 without root, and
          # the whole point of that image is running as non-root. Also
          # not 5173 - that's the Vite dev server, never what runs here.

          # No envFrom/env here - unlike every backend service, this app
          # has no runtime configuration. VITE_API_BASE_URL is a
          # build-time value baked into the static JS bundle when the
          # image is built (see frontend/README.md's "build-time vs
          # runtime" note) - setting it as a container env var here would
          # do nothing at all, since nothing at runtime reads
          # process.env in a static SPA. Changing which api-gateway this
          # points at means rebuilding the image, not editing this file.

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # readOnlyRootFilesystem + nginx is a known landmine: nginx
          # writes to /var/cache/nginx, /var/run, and /tmp even just to
          # start, and crashes immediately without them. Verified this
          # exact combination (--read-only + these three paths writable)
          # actually works against the real built image before writing
          # this, not just assumed from how nginx generally behaves.
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
