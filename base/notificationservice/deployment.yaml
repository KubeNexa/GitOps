apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
    tier: backend
spec:
  replicas: 2

  selector:
    matchLabels:
      app: notification-service

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: notification-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      terminationGracePeriodSeconds: 15

      containers:
        - name: notification-service
          image: manoj_s/notification-service:REPLACE_WITH_IMAGE_TAG
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8084
              protocol: TCP

          envFrom:
            - configMapRef:
                name: notification-service-config

          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: notification-service-secrets
                  key: mongo-uri
              # A connection string, not just a password - typically
              # embeds credentials directly (mongodb://user:pass@host/db),
              # so the whole value belongs in the Secret, not just a
              # DB_PASSWORD-shaped fragment of it like the four
              # Postgres-backed services above.

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
data:
  PORT: "8084"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  SHUTDOWN_TIMEOUT_MS: "10000"
  MONGO_CONNECT_TIMEOUT_MS: "5000"
  EMAIL_PROVIDER_MODE: "simulated"
  EMAIL_PROVIDER_TIMEOUT_MS: "3000"
  EMAIL_PROVIDER_RETRY_ATTEMPTS: "2"
  SMS_PROVIDER_MODE: "simulated"