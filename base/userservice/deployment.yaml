apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
    tier: backend
spec:
  replicas: 2

  selector:
    matchLabels:
      app: user-service

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: user-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999

      terminationGracePeriodSeconds: 15

      containers:
        - name: user-service
          image: manoj_s/user-service:REPLACE_WITH_IMAGE_TAG
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8081
              protocol: TCP

          envFrom:
            - configMapRef:
                name: user-service-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-service-secrets
                  key: db-password
            # Same Secret object api-gateway's deployment.yaml already
            # references - not a separate one. user-service issues JWTs,
            # api-gateway only verifies them; if these ever diverge,
            # every authenticated request breaks with a generic 401 and
            # no error on either side. One shared Secret is what keeps
            # that impossible instead of just unlikely.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: jwt-secret

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
data:
  SERVER_PORT: "8081"
  LOG_LEVEL: "INFO"
  SHUTDOWN_TIMEOUT: "10s"
  DB_HOST: "REPLACE_WITH_USER_DB_HOST"
  DB_PORT: "5432"
  DB_NAME: "shopstream_users"
  DB_USER: "shopstream"
  DB_CONNECTION_TIMEOUT_MS: "5000"
  DB_POOL_SIZE: "10"
  DB_POOL_MIN_IDLE: "2"
  JWT_EXPIRATION_MS: "3600000"